name: Build Combined TorrenClou Image

on:
  # Pushes to this repo built nothing at all. The installer, entrypoint,
  # supervisord config and Dockerfile all live here, so a change to any of them
  # only reached :latest if backend or frontend happened to push afterwards.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  repository_dispatch:
    types: [build-combined]
  workflow_dispatch:
    inputs:
      backend_ref:
        description: "Backend branch/tag/SHA to build"
        required: false
        default: "main"
      frontend_ref:
        description: "Frontend branch/tag/SHA to build"
        required: false
        default: "main"

concurrency:
  # Scoped by ref so a pull request build cannot cancel the main build.
  group: build-combined-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout deploy repo
        uses: actions/checkout@v4

      - name: Set image name (lowercase)
        id: image
        run: |
          echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/torrentclou" >> $GITHUB_OUTPUT

      - name: Determine refs
        id: refs
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "backend_ref=main" >> $GITHUB_OUTPUT
            echo "frontend_ref=main" >> $GITHUB_OUTPUT
            echo "trigger_repo=${{ github.event.client_payload.repository }}" >> $GITHUB_OUTPUT
            echo "trigger_sha=${{ github.event.client_payload.sha }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "backend_ref=${{ github.event.inputs.backend_ref || 'main' }}" >> $GITHUB_OUTPUT
            echo "frontend_ref=${{ github.event.inputs.frontend_ref || 'main' }}" >> $GITHUB_OUTPUT
            echo "trigger_repo=manual" >> $GITHUB_OUTPUT
            echo "trigger_sha=manual" >> $GITHUB_OUTPUT
          else
            echo "backend_ref=main" >> $GITHUB_OUTPUT
            echo "frontend_ref=main" >> $GITHUB_OUTPUT
            echo "trigger_repo=${{ github.repository }}" >> $GITHUB_OUTPUT
            echo "trigger_sha=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: TorrenClou/backend
          ref: ${{ steps.refs.outputs.backend_ref }}
          path: backend
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: TorrenClou/frontend
          ref: ${{ steps.refs.outputs.frontend_ref }}
          path: frontend
          token: ${{ secrets.DEPLOY_PAT }}

      - name: Generate version tags
        id: version
        run: |
          DATE_TAG=$(date +'%Y.%m.%d')
          BACKEND_SHA=$(cd backend && git rev-parse --short HEAD)
          FRONTEND_SHA=$(cd frontend && git rev-parse --short HEAD)
          FULL_TAG="${DATE_TAG}-${BACKEND_SHA}-${FRONTEND_SHA}"
          echo "full_tag=${FULL_TAG}" >> $GITHUB_OUTPUT
          echo "Image tag: ${FULL_TAG}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Built for amd64 only and loaded into the local daemon so the smoke test
      # below can run it. A multi-platform build cannot be --load-ed. The push
      # step afterwards reuses this cache, so this is not a second full build.
      - name: Build amd64 image for testing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: torrenclou-smoke:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Smoke test - boot with no configuration at all
        run: bash .github/scripts/smoke-test.sh

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push combined image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.full_tag }}
          labels: |
            org.opencontainers.image.title=TorrenClou
            org.opencontainers.image.description=TorrenClou All-in-One - self-hosted torrent-to-cloud
            org.opencontainers.image.vendor=TorrenClou
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.url=https://tc.gitnasr.com
            org.opencontainers.image.documentation=https://tc.gitnasr.com/docs
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.version.outputs.full_tag }}
            build.trigger.repository=${{ steps.refs.outputs.trigger_repo }}
            build.trigger.sha=${{ steps.refs.outputs.trigger_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # arm64 included so the one-line installer works on ARM VPS
          # instances and Raspberry Pi, not only x86 hosts.
          platforms: linux/amd64,linux/arm64
